# 이 값은 일부러 localhost 로 두었다.
# 컨테이너 안에서 localhost 는 그 컨테이너 자신이므로 MySQL 컨테이너가 아니다.
# 문서 10장(네트워크)에서 이 설정이 왜 틀렸는지, 어떻게 고치는지를 다룬다.
# 실행 시 SPRING_DATASOURCE_URL 환경 변수로 덮어쓴다.
spring.datasource.url=jdbc:mysql://localhost:3306/testdb?useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=1234

# 애플리케이션이 DB 없이도 뜨게 한다 — 10장에서 연결 실패를 관찰하기 위해서다.
spring.sql.init.mode=never

# 15장·관측 실습에서 쓴다. 필요한 엔드포인트만 연다.
management.endpoints.web.exposure.include=health,info

# DB 가 없어도 헬스 체크가 UP 이 되게 한다.
# 문서 16장에서 파드 준비 상태 프로브에 /actuator/health 를 쓸 수 있게 하기 위한 것이고,
# DB 연결 확인은 /db 엔드포인트로 따로 한다.
management.health.db.enabled=false
